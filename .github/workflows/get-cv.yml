name: get-cv-file-id

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Get pinned CV file_id and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.parse
          t = os.environ["TELEGRAM_BOT_TOKEN"]
          c = os.environ["TELEGRAM_CHAT_ID"]
          d = json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{t}/getChat?chat_id={c}"))
          p = d.get("result", {}).get("pinned_message", {})
          fid = p.get("document", {}).get("file_id", "NOT FOUND")
          print("FILE_ID:", fid)
          data = urllib.parse.urlencode({"chat_id": c, "text": "CV FILE_ID:\n" + fid}).encode()
          urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{t}/sendMessage", data=data))
          EOF